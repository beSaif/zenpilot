name: Release

# Push a tag like v0.2.0 (matching pyproject.toml) to publish to PyPI and create a
# GitHub release with the wheel, sdist and Claude Desktop extension, then update the MCP Registry
# (server.json must have the same version).
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # GitHub release
      id-token: write # PyPI trusted publishing and the MCP Registry login
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Check the tag matches the version
        run: test "$GITHUB_REF_NAME" = "v$(uv version --short)"
      - run: uv sync --locked
      - run: uv run pytest -m "not integration"
      - run: uv build
      - run: npx -y @anthropic-ai/mcpb@2.1.2 pack mcpb "dist/zenpilot-${GITHUB_REF_NAME#v}.mcpb"
      - run: uv publish dist/*.whl dist/*.tar.gz
      # The .mcpb installs zenpilot from PyPI, whose CDN can list the old versions for a few
      # minutes. Publish the release only once installing the bundle would work.
      - name: Wait for PyPI to list the new version
        run: |
          for _ in $(seq 60); do
            curl -sf https://pypi.org/simple/zenpilot/ | grep -q "zenpilot-${GITHUB_REF_NAME#v}.tar.gz" && exit 0
            sleep 10
          done
          exit 1
      - run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      # The registry trusts this repo's OIDC token for io.github.beSaif/*, so no login expires.
      - name: Publish to the MCP Registry
        run: |
          curl -sfL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
