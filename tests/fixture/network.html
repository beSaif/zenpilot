<!doctype html>
<html><head><meta charset="utf-8"><title>network</title></head>
<body>
<p id="status">loading</p>
<script>
const shown = document.getElementById("status");
Promise.all([fetch("/data.json").then((r) => r.json()), fetch("/missing.json")]).then(
  ([data]) => (shown.textContent = `fetched: ${data.greeting}`),
  (e) => (shown.textContent = `failed: ${e}`),
);
</script>
</body>
</html>
