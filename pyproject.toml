[project]
name = "zenpilot"
version = "0.1.0"
description = "MCP server that lets Claude drive a running Zen Browser over WebDriver BiDi"
readme = "README.md"
authors = [
    { name = "beSaif", email = "hishamkolikara@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20",
    "websockets>=17.2",
]

[project.scripts]
zenpilot = "zenpilot:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: needs a live Zen on 127.0.0.1:9222"]
